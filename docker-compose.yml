services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    depends_on: [db, redis]
    command: celery -A config worker --loglevel=info
    volumes:
      - media:/app/media

  beat:
    build: .
    env_file: .env
    depends_on: [db, redis]
    command: celery -A config beat --loglevel=info

volumes:
  pgdata:
  media:
