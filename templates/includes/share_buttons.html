{% load site_tags %}
{% with url=page.full_url|urlencode title=page.title|urlencode %}
<div class="flex flex-wrap items-center gap-2" aria-label="Share">
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ url }}" target="_blank" rel="noopener" class="rounded-full border border-line p-2 text-brand-dark hover:border-brand hover:text-brand" aria-label="Share on Facebook">{% icon "facebook" "h-4 w-4" %}</a>
  <a href="https://x.com/intent/post?url={{ url }}&text={{ title }}" target="_blank" rel="noopener" class="rounded-full border border-line p-2 text-brand-dark hover:border-brand hover:text-brand" aria-label="Share on X">{% icon "x-social" "h-4 w-4" %}</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ url }}" target="_blank" rel="noopener" class="rounded-full border border-line p-2 text-brand-dark hover:border-brand hover:text-brand" aria-label="Share on LinkedIn">{% icon "linkedin" "h-4 w-4" %}</a>
  <a href="mailto:?subject={{ title }}&body={{ url }}" class="rounded-full border border-line p-2 text-brand-dark hover:border-brand hover:text-brand" aria-label="Share by email">{% icon "mail" "h-4 w-4" %}</a>
</div>
{% endwith %}
