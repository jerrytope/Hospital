{% load wagtailimages_tags site_tags %}
{% seo as s %}
<meta name="description" content="{{ s.description|truncatechars:160 }}">
{% if s.url %}<link rel="canonical" href="{{ s.url }}"><meta property="og:url" content="{{ s.url }}">{% endif %}
<meta property="og:site_name" content="{{ org.name }}">
<meta property="og:type" content="{% if s.article %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ s.title }}">
<meta property="og:description" content="{{ s.description|truncatechars:200 }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ s.title }}">
<meta name="twitter:description" content="{{ s.description|truncatechars:200 }}">
{% if s.image %}{% image s.image fill-1200x630 as og %}<meta property="og:image" content="{{ SITE_URL }}{{ og.url }}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:image" content="{{ SITE_URL }}{{ og.url }}">{% endif %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"NGO","name":"{{ org.name|escapejs }}","url":"{{ SITE_URL }}"{% if org.tax_id %},"taxID":"{{ org.tax_id|escapejs }}"{% endif %}}</script>
{% if s.article %}<script type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","headline":"{{ s.title|escapejs }}","datePublished":"{{ s.date|date:'c' }}","author":{"@type":"Person","name":"{{ s.author|default:org.name|escapejs }}"},"publisher":{"@type":"Organization","name":"{{ org.name|escapejs }}"}}</script>{% endif %}
