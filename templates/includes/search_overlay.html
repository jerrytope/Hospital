{% load site_tags %}
<div x-data="{ open: false }" @open-search.window="open = true; $nextTick(() => $refs.q.focus())" @keydown.escape.window="open = false"
     x-cloak x-show="open" x-transition.opacity class="fixed inset-0 z-[80] overflow-y-auto bg-brand-dark/95" role="dialog" aria-modal="true" aria-label="Search">
  <div class="container-site py-6" x-trap.noscroll="open">
    <div class="flex justify-end">
      <button type="button" class="rounded-full p-2 text-white hover:bg-white/10" @click="open = false" aria-label="Close search">{% icon "x" "h-8 w-8" %}</button>
    </div>
    <form action="{% url 'search' %}" method="get" class="mx-auto mt-10 max-w-3xl" role="search">
      <label for="site-search" class="font-display text-2xl font-extrabold text-white md:text-4xl">What are you looking for?</label>
      <div class="mt-6 flex border-b-2 border-white/60 focus-within:border-white">
        <input x-ref="q" id="site-search" name="q" type="search" autocomplete="off" placeholder="Search stories, countries, programs…"
               class="w-full bg-transparent py-3 text-xl text-white placeholder:text-white/50 focus:outline-none md:text-2xl"
               hx-get="{% url 'search' %}" hx-trigger="input changed delay:300ms, search" hx-target="#live-results" hx-sync="this:replace">
        <button type="submit" class="p-2 text-white" aria-label="Search">{% icon "search" "h-7 w-7" %}</button>
      </div>
      <div id="live-results" class="mt-6" aria-live="polite"></div>
    </form>
  </div>
</div>
