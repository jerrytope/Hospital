{% load site_tags %}
{% if stories %}
<section class="section" aria-labelledby="related-h">
  <div class="container-site">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <h2 id="related-h" class="h-section">{{ heading }}</h2>
      {% if explore_url %}<a href="{{ explore_url }}" class="btn-outline">Explore more</a>{% endif %}
    </div>
    <div class="mt-8 grid gap-6 md:grid-cols-3">
      {% for story in stories %}{% include "includes/cards/story_card.html" %}{% endfor %}
    </div>
  </div>
</section>
{% endif %}
