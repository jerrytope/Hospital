<section class="bg-brand-mist py-12 md:py-16">
  <div class="container-site">
    {% if value.heading %}<h2 class="h-section mb-10 text-center">{{ value.heading }}</h2>{% endif %}
    <div class="grid gap-8 text-center sm:grid-cols-2 lg:grid-cols-4">
      {% for item in value.items %}
        <div><p class="stat-value" data-count="{{ item.value }}">{{ item.value }}</p><p class="mt-2 font-semibold text-brand-dark">{{ item.label }}</p></div>
      {% endfor %}
    </div>
  </div>
</section>
