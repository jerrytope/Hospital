<div class="container-site overflow-x-auto py-6">
  <table class="table-site">
    {% if table_header %}<thead><tr>{% for cell in table_header %}<th scope="col">{{ cell }}</th>{% endfor %}</tr></thead>{% endif %}
    <tbody>{% for row in data %}<tr>{% for cell in row %}<td>{{ cell|default:"" }}</td>{% endfor %}</tr>{% endfor %}</tbody>
  </table>
</div>
