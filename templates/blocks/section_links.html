{% load site_tags %}
<section class="section">
  <div class="container-site">
    {% if value.heading %}<h2 class="h-section mb-8">{{ value.heading }}</h2>{% endif %}
    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      {% for item in value.items %}
        <div class="flex flex-col rounded-lg border border-line p-6">
          {% if item.icon %}<span class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-brand-mist text-brand">{% icon item.icon "h-6 w-6" %}</span>{% endif %}
          <h3 class="text-xl">{{ item.title }}</h3>
          {% if item.text %}<p class="mt-2 flex-1 text-muted">{{ item.text }}</p>{% endif %}
          <a href="{{ item.link|href }}" class="btn-outline mt-5 self-start">{{ item.link|linktext }}</a>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
