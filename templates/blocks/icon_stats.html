{% load site_tags %}
<section class="container-site py-10">
  {% if value.heading %}<h2 class="h-section mb-8">{{ value.heading }}</h2>{% endif %}
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {% for item in value.items %}
      <div class="flex gap-4 rounded-lg border border-line p-6">
        <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-brand-mist text-brand">{% icon item.icon "h-7 w-7" %}</span>
        <div>
          {% if item.value %}<p class="font-display text-2xl font-extrabold text-brand-dark">{{ item.value }}</p>{% endif %}
          <p class="text-muted">{{ item.text }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
