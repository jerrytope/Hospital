{% load site_tags %}
<div x-data="{ open: true }" x-show="open" x-transition.opacity @keydown.escape.window="open = false; setTimeout(() => $el.remove(), 200)"
     class="fixed inset-0 z-[90] flex items-end justify-center bg-brand-dark/70 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="donate-modal-title"
     @click.self="open = false; setTimeout(() => $el.remove(), 200)">
  <div class="max-h-[95vh] w-full max-w-lg overflow-y-auto rounded-t-2xl bg-white p-6 shadow-2xl sm:rounded-2xl" x-trap.noscroll="open">
    <div class="mb-4 flex items-start justify-between gap-4">
      <h2 id="donate-modal-title" class="text-2xl">{{ ds.modal_heading }}</h2>
      <button type="button" class="rounded-full p-1 text-muted hover:bg-brand-mist" @click="open = false; setTimeout(() => $root.remove(), 200)" aria-label="Close">{% icon "x" "h-6 w-6" %}</button>
    </div>
    {% include "giving/partials/donate_form.html" %}
  </div>
</div>
